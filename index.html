<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CAD BANDA - Catálogo de Artistas & Bandas</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4', 100: '#dcfce7', 400: '#4ade80',
              500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d',
            },
            darkbg: '#0f172a', darkcard: '#1e293b'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { background-color: #0b0f19; color: #f8fafc; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="font-sans min-h-screen pb-20 md:pb-0 antialiased selection:bg-brand-500 selection:text-white">

  <!-- ================= TELA DE LOGIN / REGISTRO ================= -->
  <div id="authScreen" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl"></div>
      <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl"></div>

      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-500/10 text-brand-400 mb-3 border border-brand-500/20">
          <i class="fa-solid fa-guitar text-2xl"></i>
        </div>
        <h1 class="text-2xl font-black tracking-tight text-white">CAD BANDA</h1>
        <p class="text-xs text-slate-400 mt-1">Acesse para cadastrar ou gerenciar suas bandas</p>
      </div>

      <div class="flex p-1 bg-slate-800/80 rounded-xl mb-6 border border-slate-700/50">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-white bg-slate-700 shadow-sm">
          ENTRAR
        </button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white">
          CRIAR CONTA
        </button>
      </div>

      <!-- Form de Login -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1 uppercase tracking-wider">Usuário</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-user text-sm"></i></span>
            <input type="text" id="loginUser" required placeholder="Digite seu usuário" class="w-full pl-9 pr-3 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1 uppercase tracking-wider">Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-lock text-sm"></i></span>
            <input type="password" id="loginPass" required placeholder="Digite sua senha" class="w-full pl-9 pr-3 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold rounded-xl text-sm shadow-lg shadow-brand-500/25 active:scale-98 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema
        </button>
      </form>

      <!-- Form de Cadastro -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1 uppercase tracking-wider">Nome de Usuário</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-user-plus text-sm"></i></span>
            <input type="text" id="regUser" required placeholder="Escolha um usuário" class="w-full pl-9 pr-3 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1 uppercase tracking-wider">Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-key text-sm"></i></span>
            <input type="password" id="regPass" required placeholder="Crie uma senha segura" class="w-full pl-9 pr-3 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-slate-100 hover:bg-white text-slate-950 font-bold rounded-xl text-sm shadow-md active:scale-98 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-user-check"></i> Concluir Cadastro
        </button>
      </form>
    </div>
  </div>

  <!-- ================= APP CONTAINER ================= -->
  <div id="mainApp" class="max-w-4xl mx-auto hidden">
    <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-lg border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-500/10 border border-brand-500/20 text-brand-400 flex items-center justify-center font-bold">
          <i class="fa-solid fa-guitar text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-black tracking-tight text-white flex items-center gap-1.5">
            CAD BANDA
            <span id="adminBadge" class="hidden text-[10px] font-extrabold bg-red-500/20 text-red-400 px-2 py-0.5 rounded-full border border-red-500/30">ADMIN</span>
          </h1>
          <p class="text-[11px] text-slate-400">Catálogo Nuvem Supabase</p>
        </div>
      </div>
      <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-xl transition-all" title="Sair"><i class="fa-solid fa-right-from-bracket text-base"></i></button>
    </header>

    <main class="p-4 md:p-6 space-y-6">
      <!-- ABA 1: CATÁLOGO -->
      <section id="secCatalog" class="space-y-5">
        <div class="space-y-3">
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500"><i class="fa-solid fa-magnifying-glass text-sm"></i></span>
            <input type="text" id="searchInput" oninput="renderCatalog()" placeholder="Pesquisar banda, estilo ou cidade..." class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-2xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 shadow-inner">
          </div>
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="genreFilterBar"></div>
        </div>
        <div id="bandsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </section>

      <!-- ABA 2: CADASTRO -->
      <section id="secRegister" class="hidden space-y-5">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 md:p-6 shadow-xl">
          <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-800">
            <div class="w-10 h-10 rounded-xl bg-brand-500/10 text-brand-400 flex items-center justify-center"><i class="fa-solid fa-plus-circle text-lg"></i></div>
            <div>
              <h2 class="text-lg font-bold text-white">Cadastrar Nova Banda</h2>
              <p class="text-xs text-slate-400">Os dados serão salvos na nuvem do Supabase</p>
            </div>
          </div>

          <form id="bandForm" onsubmit="saveBandToSupabase(event)" class="space-y-4">
            <input type="hidden" id="editBandId">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">NOME DA BANDA *</label>
                <input type="text" id="bandName" required class="w-full px-3.5 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-sm text-white focus:border-brand-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">ESTILO MUSICAL *</label>
                <select id="bandGenre" required class="w-full px-3.5 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-sm text-white focus:border-brand-500 focus:outline-none">
                  <option value="">Selecione...</option>
                  <option value="Pisadinha">Pisadinha</option><option value="Arrocha">Arrocha</option><option value="Piseiro">Piseiro</option>
                  <option value="Brega">Brega</option><option value="Seresta">Seresta</option><option value="Calypso">Calypso</option>
                  <option value="Forró">Forró</option><option value="Sertanejo">Sertanejo</option><option value="Pagode / Samba">Pagode / Samba</option>
                  <option value="Pop / Rock">Pop / Rock</option><option value="Axé / Reggae">Axé / Reggae</option><option value="Gospel">Gospel</option><option value="Outros">Outros</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">RESPONSÁVEL *</label>
                <input type="text" id="bandContact" required class="w-full px-3.5 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-sm text-white focus:border-brand-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">CIDADE / UF *</label>
                <input type="text" id="bandCity" required class="w-full px-3.5 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-sm text-white focus:border-brand-500 focus:outline-none">
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">WHATSAPP *</label>
                <input type="text" id="bandWhatsapp" required placeholder="85999998888" class="w-full px-3.5 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-sm text-white focus:border-brand-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">FOTO DA BANDA *</label>
                <input type="file" id="bandPhotoFile" accept="image/*" class="w-full px-3 py-2 bg-slate-800/90 border border-slate-700 rounded-xl text-xs text-slate-300 file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-brand-500 file:text-slate-950 cursor-pointer">
                <input type="hidden" id="bandPhotoUrl">
              </div>
            </div>

            <div class="pt-2 border-t border-slate-800">
              <h3 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-3">Redes Sociais</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="url" id="bandSuaMusica" placeholder="Link Sua Música" class="w-full px-3 py-2 bg-slate-800/90 border border-slate-700 rounded-xl text-xs text-white">
                <input type="url" id="bandInstagram" placeholder="Link Instagram" class="w-full px-3 py-2 bg-slate-800/90 border border-slate-700 rounded-xl text-xs text-white">
                <input type="url" id="bandYoutube" placeholder="Link YouTube" class="w-full px-3 py-2 bg-slate-800/90 border border-slate-700 rounded-xl text-xs text-white">
                <input type="url" id="bandTiktok" placeholder="Link TikTok" class="w-full px-3 py-2 bg-slate-800/90 border border-slate-700 rounded-xl text-xs text-white">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">BIOGRAFIA / REPERTÓRIO</label>
              <textarea id="bandBio" rows="3" class="w-full px-3.5 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-sm text-white focus:border-brand-500 focus:outline-none"></textarea>
            </div>

            <div class="flex gap-2 pt-2">
              <button type="submit" id="submitBtn" class="flex-1 py-3 bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold rounded-xl text-sm shadow-lg shadow-brand-500/25 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> <span id="submitBtnText">Salvar na Nuvem</span>
              </button>
              <button type="button" onclick="resetForm()" class="px-4 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl text-sm">Limpar</button>
            </div>
          </form>
        </div>
      </section>

      <!-- ABA 3: GERENCIAR -->
      <section id="secManage" class="hidden space-y-4">
        <div id="manageBandsList" class="space-y-3"></div>
      </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/90 backdrop-blur-md border-t border-slate-800/80 px-4 py-2">
      <div class="max-w-md mx-auto flex justify-around items-center">
        <button id="navCatalog" onclick="switchNavTab('secCatalog')" class="flex flex-col items-center gap-1 text-brand-400 font-bold text-[11px]"><i class="fa-solid fa-layer-group text-lg"></i><span>Catálogo</span></button>
        <button id="navRegister" onclick="switchNavTab('secRegister')" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-[11px]"><i class="fa-solid fa-circle-plus text-lg"></i><span>Cadastrar</span></button>
        <button id="navManage" onclick="switchNavTab('secManage')" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-[11px]"><i class="fa-solid fa-list-check text-lg"></i><span>Gerenciar</span></button>
      </div>
    </nav>
  </div>

  <!-- SCRIPT SUPABASE E APLICAÇÃO -->
  <script>
    // CONFIGURAÇÃO DO SUPABASE (Insira seus dados aqui)
    const SUPABASE_URL = "SUA_URL_DO_SUPABASE_AQUI";
    const SUPABASE_KEY = "SUA_CHAVE_ANON_AQUI";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_USER = "JACIANO";
    const ADMIN_PASS = "Kricia10#";

    let currentUser = null;
    let selectedGenreFilter = "TODOS";
    let cachedBands = [];

    const genresList = ["TODOS", "Pisadinha", "Arrocha", "Piseiro", "Brega", "Seresta", "Calypso", "Forró", "Sertanejo", "Pagode / Samba", "Pop / Rock", "Axé / Reggae", "Gospel", "Outros"];

    window.addEventListener('DOMContentLoaded', () => {
      initUsersStorage();
      checkSession();
      renderGenreFilterBar();
      loadBandsFromSupabase();
    });

    function initUsersStorage() {
      if (!localStorage.getItem('cadbanda_users')) {
        localStorage.setItem('cadbanda_users', JSON.stringify([{ username: ADMIN_USER, password: ADMIN_PASS, role: 'admin' }]));
      }
    }

    async function loadBandsFromSupabase() {
      const { data, error } = await supabaseClient.from('bands').select('*');
      if (error) {
        console.error("Erro ao carregar dados:", error.message);
        return;
      }
      cachedBands = data || [];
      renderCatalog();
      if (!document.getElementById('secManage').classList.contains('hidden')) {
        renderManageList();
      }
    }

    function checkSession() {
      const savedUser = JSON.parse(localStorage.getItem('cadbanda_session'));
      if (savedUser) {
        currentUser = savedUser;
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('adminBadge').classList.toggle('hidden', currentUser.role !== 'admin');
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('mainApp').classList.add('hidden');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      if (user.toUpperCase() === ADMIN_USER.toUpperCase() && pass === ADMIN_PASS) {
        localStorage.setItem('cadbanda_session', JSON.stringify({ username: ADMIN_USER, role: 'admin' }));
        checkSession();
        loadBandsFromSupabase();
        return;
      }

      const users = JSON.parse(localStorage.getItem('cadbanda_users')) || [];
      const found = users.find(u => u.username.toLowerCase() === user.toLowerCase() && u.password === pass);

      if (found) {
        localStorage.setItem('cadbanda_session', JSON.stringify({ username: found.username, role: 'user' }));
        checkSession();
        loadBandsFromSupabase();
      } else {
        alert("Usuário ou senha incorretos!");
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const user = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value.trim();
      const users = JSON.parse(localStorage.getItem('cadbanda_users')) || [];

      if (users.some(u => u.username.toLowerCase() === user.toLowerCase())) {
        alert("Este usuário já existe!");
        return;
      }

      users.push({ username: user, password: pass, role: 'user' });
      localStorage.setItem('cadbanda_users', JSON.stringify(users));
      alert("Conta criada com sucesso! Faça login.");
      switchAuthTab('login');
    }

    function logout() {
      localStorage.removeItem('cadbanda_session');
      checkSession();
    }

    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);
    }

    function switchNavTab(secId) {
      document.getElementById('secCatalog').classList.add('hidden');
      document.getElementById('secRegister').classList.add('hidden');
      document.getElementById('secManage').classList.add('hidden');
      document.getElementById(secId).classList.remove('hidden');

      if (secId === 'secCatalog') renderCatalog();
      if (secId === 'secManage') renderManageList();
    }

    function renderGenreFilterBar() {
      const container = document.getElementById('genreFilterBar');
      container.innerHTML = genresList.map(g => `
        <button onclick="setGenreFilter('${g}')" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap transition-all ${g === selectedGenreFilter ? 'bg-brand-500 text-slate-950 shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-400'}">${g}</button>
      `).join('');
    }

    function setGenreFilter(genre) {
      selectedGenreFilter = genre;
      renderGenreFilterBar();
      renderCatalog();
    }

    function renderCatalog() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('bandsGrid');

      const filtered = cachedBands.filter(b => {
        const matchGenre = selectedGenreFilter === "TODOS" || b.genre === selectedGenreFilter;
        const matchSearch = b.name.toLowerCase().includes(search) || b.contact_name?.toLowerCase().includes(search) || b.city?.toLowerCase().includes(search);
        return matchGenre && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500"><i class="fa-solid fa-compact-disc text-4xl mb-2"></i><p>Nenhuma banda encontrada.</p></div>`;
        return;
      }

      grid.innerHTML = filtered.map(b => `
        <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden flex flex-col justify-between">
          <div>
            <div class="relative h-44 overflow-hidden">
              <img src="${b.photo || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80'}" class="w-full h-full object-cover">
              <span class="absolute top-3 left-3 text-[10px] font-extrabold uppercase bg-slate-950/80 text-brand-400 px-2.5 py-1 rounded-full">${b.genre}</span>
            </div>
            <div class="p-4 space-y-2">
              <h3 class="text-base font-extrabold text-white">${b.name}</h3>
              <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot mr-1"></i>${b.city}</p>
              <p class="text-xs text-slate-400">Contato: <strong class="text-slate-200">${b.contact_name}</strong></p>
            </div>
          </div>
          <div class="p-4 pt-0">
            <a href="https://wa.me/55${b.whatsapp?.replace(/\D/g, '')}" target="_blank" class="w-full py-2.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-xl font-bold text-xs flex items-center justify-center gap-2">
              <i class="fa-brands fa-whatsapp text-sm"></i> Chamar no WhatsApp
            </a>
          </div>
        </div>
      `).join('');
    }

    async function saveBandToSupabase(e) {
      e.preventDefault();
      const submitBtnText = document.getElementById('submitBtnText');
      submitBtnText.textContent = "Salvando na Nuvem...";

      const fileInput = document.getElementById('bandPhotoFile');
      let photoUrl = document.getElementById('bandPhotoUrl').value;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileName = `${Date.now()}_${file.name}`;
        const { data: uploadData, error: uploadError } = await supabaseClient.storage.from('band-photos').upload(fileName, file);
        
        if (uploadError) {
          alert("Erro ao enviar foto: " + uploadError.message);
          submitBtnText.textContent = "Salvar na Nuvem";
          return;
        }

        const { data: urlData } = supabaseClient.storage.from('band-photos').getPublicUrl(fileName);
        photoUrl = urlData.publicUrl;
      }

      const bandData = {
        id: document.getElementById('editBandId').value || Date.now().toString(),
        name: document.getElementById('bandName').value.trim(),
        genre: document.getElementById('bandGenre').value,
        contact_name: document.getElementById('bandContact').value.trim(),
        city: document.getElementById('bandCity').value.trim(),
        whatsapp: document.getElementById('bandWhatsapp').value.trim(),
        photo: photoUrl || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80',
        sua_musica: document.getElementById('bandSuaMusica').value.trim(),
        instagram: document.getElementById('bandInstagram').value.trim(),
        youtube: document.getElementById('bandYoutube').value.trim(),
        tiktok: document.getElementById('bandTiktok').value.trim(),
        bio: document.getElementById('bandBio').value.trim(),
        owner: currentUser?.username || "Anônimo"
      };

      const { error } = await supabaseClient.from('bands').upsert([bandData]);
      submitBtnText.textContent = "Salvar na Nuvem";

      if (error) {
        alert("Erro ao salvar no banco: " + error.message);
      } else {
        alert("Salvo com sucesso na nuvem!");
        resetForm();
        loadBandsFromSupabase();
        switchNavTab('secCatalog');
      }
    }

    function renderManageList() {
      const container = document.getElementById('manageBandsList');
      const isAdmin = currentUser?.role === 'admin';

      if (cachedBands.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500">Nenhuma banda cadastrada.</div>`;
        return;
      }

      container.innerHTML = cachedBands.map(b => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 overflow-hidden">
            <img src="${b.photo}" class="w-12 h-12 rounded-xl object-cover shrink-0">
            <div class="truncate">
              <h4 class="font-extrabold text-sm text-white truncate">${b.name}</h4>
              <p class="text-xs text-slate-400">${b.genre} • ${b.city}</p>
            </div>
          </div>
          ${isAdmin ? `<button onclick="deleteBand('${b.id}')" class="px-3 py-2 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-xs font-bold"><i class="fa-solid fa-trash"></i> Excluir</button>` : ''}
        </div>
      `).join('');
    }

    async function deleteBand(id) {
      if (confirm("Deseja realmente excluir esta banda?")) {
        const { error } = await supabaseClient.from('bands').delete().eq('id', id);
        if (error) {
          alert("Erro ao excluir: " + error.message);
        } else {
          loadBandsFromSupabase();
        }
      }
    }

    function resetForm() {
      document.getElementById('bandForm').reset();
      document.getElementById('editBandId').value = "";
      document.getElementById('bandPhotoUrl').value = "";
    }
  </script>
</body>
</html>
